# Promote a published release to the stable channel.
#
# Publishing and recommending are deliberately separate steps: cutting vX.Y.Z
# only pushes immutable version tags; this workflow moves the shared `latest`
# tag to a version AFTER it has been validated (staging/dogfood soak).
# Users tracking :latest therefore always receive a soaked release.
#
# Adapted from ai-engkit's promote.yml. GitHub Releases are created by CI;
# promotion remains separate and only retags the published images below.
#
name: Promote stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to promote to latest (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate version input
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must match v<major>.<minor>.<patch> (e.g. v0.1.0), got: ${{ inputs.version }}"
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-tag the EXISTING published images — same digests, never rebuilt.
      - name: Promote images to latest
        run: |
          set -euo pipefail
          BASE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          for suffix in '' '-sftp' '-sftp-admin'; do
            IMAGE="${BASE_IMAGE}${suffix}"
            docker pull "${IMAGE}:${{ inputs.version }}"
            docker tag "${IMAGE}:${{ inputs.version }}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:latest" | cut -f2 -d'@')
            echo "::notice::Promoted ${IMAGE}:${{ inputs.version }} to latest (digest sha256:${DIGEST})"
          done

      - name: Summary
        run: |
          echo "### Promoted \`${{ inputs.version }}\` to \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \\`simple-fileurl\\` digest moved as-is (no rebuild)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \\`simple-fileurl-sftp\\` digest moved as-is (no rebuild)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \\`simple-fileurl-sftp-admin\\` digest moved as-is (no rebuild)" >> "$GITHUB_STEP_SUMMARY"
