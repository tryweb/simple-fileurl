name: CI

permissions:
  contents: read

# Rapid successive pushes cancel the queued run instead of stacking pipelines.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'openspec/**'
    tags: ['v*']
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'openspec/**'
  workflow_dispatch:

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Installer checks
        run: bash test/install-upgrade.sh

      - name: Vet and test
        run: |
          go vet ./...
          go test -race -shuffle=on -count=1 ./...

  smoke:
    name: Image Build and Smoke Test
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: simple-fileurl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build SFTP images
        run: |
          docker build -f Dockerfile.sftp -t simple-fileurl-sftp:ci .
          docker build -f Dockerfile.sftp-admin -t simple-fileurl-sftp-admin:ci .
          docker build -f Dockerfile.sftp-test -t simple-fileurl-sftp-test:ci .

      - name: Run SFTP contract tests
        run: |
          bash test/sftp-config.sh
          bash test/sftp-reconcile.sh
          docker run --rm simple-fileurl-sftp-test:ci sh -c \
            'cd /src && sh test/sftp-config.sh && sh test/sftp-reconcile.sh'

      - name: Validate compose files
        run: |
          HOST_SHARE_PATH=/tmp/ci-share SHARE_PREFIX=files PUBLIC_URL=https://example.test \
            SFTP_ADMIN_PASSWORD=dummy \
            docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.dev.yml config > /dev/null

      - name: Start dev service
        run: docker compose -f docker-compose.dev.yml up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:18080/healthz && exit 0
            sleep 2
          done
          echo "service never became healthy" >&2
          exit 1

      - name: Run smoke test
        run: bash test/smoke.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.dev.yml logs || true
          docker compose -f docker-compose.dev.yml ps || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v --remove-orphans || true

  push:
    name: Push to GHCR
    needs: [unit, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
      - name: Build and push SFTP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sftp
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-sftp:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-sftp:sha-${{ github.sha }}
          cache-from: type=gha
      - name: Build and push SFTP Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sftp-admin
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-sftp-admin:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-sftp-admin:sha-${{ github.sha }}
          cache-from: type=gha
