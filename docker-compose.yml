services:
  file-sharing:
    image: ghcr.io/tryweb/simple-fileurl:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # Host data directory containing the SHARE_PREFIX subtree, mounted
      # read-only at the fixed container path.
      - "${HOST_SHARE_PATH:?HOST_SHARE_PATH is required}:/opt/sharefiles:ro"
      # Named volume holding links.json for the share-link system.
      - "file-links:/var/lib/file-links:rw"
      # Named volume holding config.json for live settings. Read-only here:
      # only sftp-admin seeds and rewrites it; file-sharing only reads.
      - "app-config:/etc/app:ro"
    environment:
      SHARE_ROOT: /opt/sharefiles
      SHARE_PREFIX: "${SHARE_PREFIX:?SHARE_PREFIX is required}"
      PUBLIC_URL: "${PUBLIC_URL:?PUBLIC_URL is required}"
      HASH_TARGET: "${HASH_TARGET:-file}"
      HASH_ALGORITHM: "${HASH_ALGORITHM:-md5}"
      # Bearer token for the share-link management API (/api/links).
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required}"
      # Directory holding links.json, on the file-links named volume.
      LINKS_DIR: /var/lib/file-links
      WEB_GID: "${WEB_GID:-2001}"
      PORT: "8080"
    # Supplementary group granting read access to per-user directories
    # (mode 0750, group WEB_GID) on the read-only share mount.
    group_add:
      - "${WEB_GID:-2001}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  sftp:
    image: ghcr.io/tryweb/simple-fileurl-sftp:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "${SFTP_PORT:-2222}:22"
    volumes:
      # OpenSSH requires the chroot root to be root-owned and non-writable.
      # Prepare HOST_SHARE_PATH accordingly; only SHARE_PREFIX is writable.
      - "${HOST_SHARE_PATH:?HOST_SHARE_PATH is required}:/share:rw"
      - "sftp-users:/var/lib/sftp-users:ro"
    environment:
      SHARE_PREFIX: "${SHARE_PREFIX:?SHARE_PREFIX is required}"
      SFTP_GID: "${SFTP_GID:-2000}"
      WEB_GID: "${WEB_GID:-2001}"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  sftp-admin:
    image: ghcr.io/tryweb/simple-fileurl-sftp-admin:${IMAGE_TAG:?IMAGE_TAG is required}
    # Remote-accessible by default; require TLS/private networking and a host firewall.
    ports:
      - "${SFTP_ADMIN_PORT:-8081}:8080"
    volumes:
      - "sftp-users:/var/lib/sftp-users:rw"
      - "app-config:/etc/app:rw"
      # Named volume holding links.json for the share-link system, shared
      # with file-sharing so the admin can manage the same links.
      - "file-links:/var/lib/file-links:rw"
    environment:
      PORT: "8080"
      SFTP_ADMIN_PASSWORD: "${SFTP_ADMIN_PASSWORD:?SFTP_ADMIN_PASSWORD is required}"
      SFTP_SEED_USER: "${SFTP_SEED_USER:-}"
      SFTP_SEED_PUBKEY: "${SFTP_SEED_PUBKEY:-}"
      # Duplicated for first-boot config.json seeding (sftp-admin is the
      # only seeder); runtime values come from the shared file afterwards.
      HASH_TARGET: "${HASH_TARGET:-file}"
      HASH_ALGORITHM: "${HASH_ALGORITHM:-md5}"
      PUBLIC_URL: "${PUBLIC_URL:?PUBLIC_URL is required}"
      WEB_GID: "${WEB_GID:-2001}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required}"
      # Directory holding links.json, on the file-links named volume.
      LINKS_DIR: /var/lib/file-links
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  sftp-users:
  file-links:
  app-config:
