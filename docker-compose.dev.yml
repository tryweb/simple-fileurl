services:
  file-sharing:
    build: .
    image: simple-fileurl:dev
    container_name: simple-fileurl-dev
    ports:
      - "${PORT:-18080}:8080"
    volumes:
      # Repo-local fixture tree so dev and CI work without an SFTP host.
      - ./testdata:/opt/sharefiles:ro
    env_file:
      - path: .env
        required: false
    environment:
      SHARE_ROOT: /opt/sharefiles
      SHARE_PREFIX: "${SHARE_PREFIX:-files}"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:${PORT:-18080}}"
      HASH_TARGET: "${HASH_TARGET:-file}"
      HASH_ALGORITHM: "${HASH_ALGORITHM:-md5}"
      ADMIN_PATH: "${ADMIN_PATH:-admin123456}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
