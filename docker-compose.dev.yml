services:
  share-init:
    build:
      context: .
      dockerfile: Dockerfile.dev-share
    image: simple-fileurl-dev-share:dev
    volumes:
      - share-data:/share
    environment:
      SFTP_GID: "${SFTP_GID:-2000}"
      WEB_GID: "${WEB_GID:-2001}"
    command:
      - /bin/sh
      - -ec
      - |
        if [ -f /share/.fixture-initialized ]; then exit 0; fi
        cp -a /seed/. /share/
        chown root:root /share
        chmod 0755 /share
        chown root:$$SFTP_GID /share/files
        chmod 2775 /share/files
        touch /share/.fixture-initialized
    restart: "no"

  file-sharing:
    build: .
    image: simple-fileurl:dev
    container_name: simple-fileurl-dev
    ports:
      - "${PORT:-18080}:8080"
    volumes:
      # share-init copies the fixture into a root-owned volume for OpenSSH.
      - share-data:/opt/sharefiles:ro
      # Named volume holding links.json for the share-link system.
      - file-links:/var/lib/file-links:rw
      # Named volume holding config.json for live settings. Read-only here:
      # only sftp-admin seeds and rewrites it; file-sharing only reads.
      - app-config:/etc/app:ro
    env_file:
      - path: .env
        required: false
    environment:
      SHARE_ROOT: /opt/sharefiles
      SHARE_PREFIX: "${SHARE_PREFIX:-files}"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:${PORT:-18080}}"
      HASH_TARGET: "${HASH_TARGET:-file}"
      HASH_ALGORITHM: "${HASH_ALGORITHM:-md5}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-dev-admin-token}"
      LINKS_DIR: /var/lib/file-links
      WEB_GID: "${WEB_GID:-2001}"
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  sftp:
    build:
      context: .
      dockerfile: Dockerfile.sftp
    image: simple-fileurl-sftp:dev
    container_name: simple-fileurl-sftp-dev
    depends_on:
      share-init:
        condition: service_completed_successfully
    ports:
      - "${SFTP_PORT:-12222}:22"
    volumes:
      - share-data:/share:rw
      - sftp-users:/var/lib/sftp-users:ro
    environment:
      SHARE_PREFIX: "${SHARE_PREFIX:-files}"
      SFTP_GID: "${SFTP_GID:-2000}"
      WEB_GID: "${WEB_GID:-2001}"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  sftp-admin:
    build:
      context: .
      dockerfile: Dockerfile.sftp-admin
    image: simple-fileurl-sftp-admin:dev
    container_name: simple-fileurl-sftp-admin-dev
    ports:
      - "127.0.0.1:${SFTP_ADMIN_PORT:-18081}:8080"
    volumes:
      - sftp-users:/var/lib/sftp-users:rw
      - app-config:/etc/app:rw
    environment:
      PORT: "8080"
      SFTP_ADMIN_PASSWORD: "${SFTP_ADMIN_PASSWORD:-dev-admin-password}"
      SFTP_SEED_USER: "${SFTP_SEED_USER:-}"
      SFTP_SEED_PUBKEY: "${SFTP_SEED_PUBKEY:-}"
      HASH_TARGET: "${HASH_TARGET:-file}"
      HASH_ALGORITHM: "${HASH_ALGORITHM:-md5}"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:${PORT:-18080}}"
      WEB_GID: "${WEB_GID:-2001}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-dev-admin-token}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  share-data:
  sftp-users:
  file-links:
  app-config:
